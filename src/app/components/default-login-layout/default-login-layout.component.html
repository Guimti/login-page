<main>
    <section class="form-section"> 
        <div class="stars-container">
            <svg width="100%" height="100%" viewBox="0 0 1000 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <style>
                        @keyframes falling {
                            0% { transform: translateY(-10px); opacity: 0; }
                            10% { opacity: 1; }
                            90% { opacity: 1; }
                            100% { transform: translateY(1000px); opacity: 0; }
                        }
                        .star {
                            fill: white;
                            animation: falling 3s linear infinite;
                        }
                    </style>
                </defs>
                
                <!-- Estrelas caindo -->
                <g class="stars">
                    <!-- Primeira coluna -->
                    <circle cx="50" cy="0" r="1" class="star" style="animation-duration: 3s; animation-delay: 0s;"/>
                    <circle cx="50" cy="0" r="1" class="star" style="animation-duration: 3.5s; animation-delay: 0.5s;"/>
                    <circle cx="50" cy="0" r="1" class="star" style="animation-duration: 4s; animation-delay: 1s;"/>
                    <circle cx="50" cy="0" r="1" class="star" style="animation-duration: 3.2s; animation-delay: 1.5s;"/>
                    <circle cx="50" cy="0" r="1" class="star" style="animation-duration: 3.8s; animation-delay: 2s;"/>
                    <circle cx="50" cy="0" r="1" class="star" style="animation-duration: 3.3s; animation-delay: 2.5s;"/>
                    
                    <!-- Segunda coluna -->
                    <circle cx="150" cy="0" r="1" class="star" style="animation-duration: 3.7s; animation-delay: 0.2s;"/>
                    <circle cx="150" cy="0" r="1" class="star" style="animation-duration: 3.1s; animation-delay: 0.7s;"/>
                    <circle cx="150" cy="0" r="1" class="star" style="animation-duration: 3.9s; animation-delay: 1.2s;"/>
                    <circle cx="150" cy="0" r="1" class="star" style="animation-duration: 3.4s; animation-delay: 1.7s;"/>
                    <circle cx="150" cy="0" r="1" class="star" style="animation-duration: 3.6s; animation-delay: 2.2s;"/>
                    <circle cx="150" cy="0" r="1" class="star" style="animation-duration: 3.2s; animation-delay: 2.7s;"/>
                    
                    <!-- Terceira coluna -->
                    <circle cx="250" cy="0" r="1" class="star" style="animation-duration: 3.3s; animation-delay: 0.4s;"/>
                    <circle cx="250" cy="0" r="1" class="star" style="animation-duration: 3.8s; animation-delay: 0.9s;"/>
                    <circle cx="250" cy="0" r="1" class="star" style="animation-duration: 3.5s; animation-delay: 1.4s;"/>
                    <circle cx="250" cy="0" r="1" class="star" style="animation-duration: 3.1s; animation-delay: 1.9s;"/>
                    <circle cx="250" cy="0" r="1" class="star" style="animation-duration: 3.7s; animation-delay: 2.4s;"/>
                    <circle cx="250" cy="0" r="1" class="star" style="animation-duration: 3.4s; animation-delay: 2.9s;"/>
                    
                    <!-- Quarta coluna -->
                    <circle cx="350" cy="0" r="1" class="star" style="animation-duration: 3.6s; animation-delay: 0.1s;"/>
                    <circle cx="350" cy="0" r="1" class="star" style="animation-duration: 3.2s; animation-delay: 0.6s;"/>
                    <circle cx="350" cy="0" r="1" class="star" style="animation-duration: 3.8s; animation-delay: 1.1s;"/>
                    <circle cx="350" cy="0" r="1" class="star" style="animation-duration: 3.5s; animation-delay: 1.6s;"/>
                    <circle cx="350" cy="0" r="1" class="star" style="animation-duration: 3.3s; animation-delay: 2.1s;"/>
                    <circle cx="350" cy="0" r="1" class="star" style="animation-duration: 3.7s; animation-delay: 2.6s;"/>
                    
                    <!-- Quinta coluna -->
                    <circle cx="450" cy="0" r="1" class="star" style="animation-duration: 3.4s; animation-delay: 0.3s;"/>
                    <circle cx="450" cy="0" r="1" class="star" style="animation-duration: 3.9s; animation-delay: 0.8s;"/>
                    <circle cx="450" cy="0" r="1" class="star" style="animation-duration: 3.6s; animation-delay: 1.3s;"/>
                    <circle cx="450" cy="0" r="1" class="star" style="animation-duration: 3.2s; animation-delay: 1.8s;"/>
                    <circle cx="450" cy="0" r="1" class="star" style="animation-duration: 3.8s; animation-delay: 2.3s;"/>
                    <circle cx="450" cy="0" r="1" class="star" style="animation-duration: 3.5s; animation-delay: 2.8s;"/>
                    
                    <!-- Sexta coluna -->
                    <circle cx="550" cy="0" r="1" class="star" style="animation-duration: 3.7s; animation-delay: 0.2s;"/>
                    <circle cx="550" cy="0" r="1" class="star" style="animation-duration: 3.3s; animation-delay: 0.7s;"/>
                    <circle cx="550" cy="0" r="1" class="star" style="animation-duration: 3.9s; animation-delay: 1.2s;"/>
                    <circle cx="550" cy="0" r="1" class="star" style="animation-duration: 3.6s; animation-delay: 1.7s;"/>
                    <circle cx="550" cy="0" r="1" class="star" style="animation-duration: 3.2s; animation-delay: 2.2s;"/>
                    <circle cx="550" cy="0" r="1" class="star" style="animation-duration: 3.8s; animation-delay: 2.7s;"/>
                    
                    <!-- Sétima coluna -->
                    <circle cx="650" cy="0" r="1" class="star" style="animation-duration: 3.5s; animation-delay: 0.4s;"/>
                    <circle cx="650" cy="0" r="1" class="star" style="animation-duration: 3.1s; animation-delay: 0.9s;"/>
                    <circle cx="650" cy="0" r="1" class="star" style="animation-duration: 3.7s; animation-delay: 1.4s;"/>
                    <circle cx="650" cy="0" r="1" class="star" style="animation-duration: 3.3s; animation-delay: 1.9s;"/>
                    <circle cx="650" cy="0" r="1" class="star" style="animation-duration: 3.9s; animation-delay: 2.4s;"/>
                    <circle cx="650" cy="0" r="1" class="star" style="animation-duration: 3.6s; animation-delay: 2.9s;"/>
                    
                    <!-- Oitava coluna -->
                    <circle cx="750" cy="0" r="1" class="star" style="animation-duration: 3.8s; animation-delay: 0.1s;"/>
                    <circle cx="750" cy="0" r="1" class="star" style="animation-duration: 3.4s; animation-delay: 0.6s;"/>
                    <circle cx="750" cy="0" r="1" class="star" style="animation-duration: 3.2s; animation-delay: 1.1s;"/>
                    <circle cx="750" cy="0" r="1" class="star" style="animation-duration: 3.7s; animation-delay: 1.6s;"/>
                    <circle cx="750" cy="0" r="1" class="star" style="animation-duration: 3.3s; animation-delay: 2.1s;"/>
                    <circle cx="750" cy="0" r="1" class="star" style="animation-duration: 3.9s; animation-delay: 2.6s;"/>
                    
                    <!-- Nona coluna -->
                    <circle cx="850" cy="0" r="1" class="star" style="animation-duration: 3.6s; animation-delay: 0.3s;"/>
                    <circle cx="850" cy="0" r="1" class="star" style="animation-duration: 3.2s; animation-delay: 0.8s;"/>
                    <circle cx="850" cy="0" r="1" class="star" style="animation-duration: 3.8s; animation-delay: 1.3s;"/>
                    <circle cx="850" cy="0" r="1" class="star" style="animation-duration: 3.5s; animation-delay: 1.8s;"/>
                    <circle cx="850" cy="0" r="1" class="star" style="animation-duration: 3.1s; animation-delay: 2.3s;"/>
                    <circle cx="850" cy="0" r="1" class="star" style="animation-duration: 3.7s; animation-delay: 2.8s;"/>
                    
                    <!-- Décima coluna -->
                    <circle cx="950" cy="0" r="1" class="star" style="animation-duration: 3.9s; animation-delay: 0.2s;"/>
                    <circle cx="950" cy="0" r="1" class="star" style="animation-duration: 3.5s; animation-delay: 0.7s;"/>
                    <circle cx="950" cy="0" r="1" class="star" style="animation-duration: 3.3s; animation-delay: 1.2s;"/>
                    <circle cx="950" cy="0" r="1" class="star" style="animation-duration: 3.8s; animation-delay: 1.7s;"/>
                    <circle cx="950" cy="0" r="1" class="star" style="animation-duration: 3.4s; animation-delay: 2.2s;"/>
                    <circle cx="950" cy="0" r="1" class="star" style="animation-duration: 3.2s; animation-delay: 2.7s;"/>
                </g>
            </svg>
        </div>
        
        <div class="login-container">
            <h2 class="title">Entre em sua nave de exploração</h2>
            
            <form class="login-form">
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Seu email" />
                </div>
                
                <div class="input-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" placeholder="Sua senha" />
                </div>
                
                <div class="remember-forgot">
                    <label class="checkbox-container">
                        <input type="checkbox" />
                        <span class="checkmark"></span>
                        Lembrar-me
                    </label>
                </div>
                
                <button class="btn-primary">Entrar</button>
        
            <div class="divider">
                <div></div>
                    <span>ou</span>
                <div></div>
            </div>
    

                <div class="forgot-password-link">
                    <a href="#">Esqueceu senha?</a>
                </div>
            </form>
        </div>
    </section>

    <section class="main-section">
        <div class="space-elements">
            <div class="planet planet-1"></div>
            <div class="planet planet-2"></div>
            <div class="planet planet-3"></div>
            <div class="stars"></div>
        </div>
        <img src="assets\svg\astronaut.png" class="astronaut-img" alt="Astronaut"/>
        <h1>Bem-vindo ao Xspace</h1>
        <p>Explore novos horizontes com sua conta</p>
    </section>
</main>
