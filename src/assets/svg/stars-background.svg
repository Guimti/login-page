<?xml version="1.0" encoding="UTF-8"?>
<svg width="100%" height="100%" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <style>
    .star {
      fill: white;
      opacity: 0.8;
    }
    
    @keyframes twinkle {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 0.4; }
    }
    
    .star:nth-child(3n) { animation: twinkle 3s infinite; }
    .star:nth-child(3n+1) { animation: twinkle 4s infinite; }
    .star:nth-child(3n+2) { animation: twinkle 5s infinite; }
  </style>
  
